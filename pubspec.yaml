name: shoeebapk
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  http: ^1.1.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0  # For smooth animations
  get_storage: ^2.1.1
  get: ^4.7.3
  fluttertoast: ^9.0.0
  provider: ^6.1.5+1
  get_it: ^9.2.0
  intl: ^0.20.2
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  image_picker: ^1.0.4
  image_cropper: ^12.2.1
  confetti: ^0.8.0
  animated_text_kit: ^4.2.2
  flutter_svg: ^2.2.3
  flutter_staggered_animations: ^1.1.1
  country_flags: ^4.1.2
  flutter_screenutil: ^5.9.3
  google_sign_in: ^6.2.1
  device_info_plus: ^11.3.3
  socket_io_client: ^3.1.1
  timeago: ^3.6.1
  record: ^6.2.0
  audioplayers: ^6.6.0
  path_provider: ^2.1.5
  photo_view: ^0.15.0
  flutter_svga: ^0.0.8
  cached_network_image: ^3.4.1
  livekit_client: ^2.5.4
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.3
  flutter_local_notifications: ^19.2.1
  skeletonizer: ^2.1.3
  video_compress: ^3.1.4
  video_player: ^2.10.1
  share_plus: ^12.0.2
  app_links: ^6.3.3

dependency_overrides:
  protobuf: ^4.1.0  # or ^6.0.0  

dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: ^1.5.0

  flutter_lints: ^5.0.0


flutter:


  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/moke/
    - assets/audio/
    - assets/gifts/svga/
    - assets/gifts/sounds/
    - assets/gifts/images/

  fonts:
    - family: WendyOne
      fonts:
        - asset: assets/fonts/WendyOne-Regular.ttf
    - family: ZenDots
      fonts:
        - asset: assets/fonts/ZenDots-Regular.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
